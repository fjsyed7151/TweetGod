[project]
name = "tweetgod"
version = "0.1.0"
description = "AI-powered Twitter engagement bot"
requires-python = ">=3.12"
dependencies = [
    "tweepy>=4.14",
    "httpx>=0.27",
    "supabase>=2.0",
    "apscheduler>=3.10",
    "python-telegram-bot>=21.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
"numpy>=1.26",
    "sentry-sdk>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
